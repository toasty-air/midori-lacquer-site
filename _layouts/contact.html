---
layout: default
---
<article class="page contact">
  <h1 class="page-title">{{ page.title }}</h1>
  <div class="prose">
    {{ content }}
  </div>

  {% comment %}
    メールフォーム：SSGform（https://ssgform.com/）に接続。
    action のURLは、SSGformの管理画面で発行された「送信先URL」をそのまま入れる。
    送信後の画面はSSGform標準のもの（独自ドメイン確定後に、必要ならサンクスページを設定する）。
  {% endcomment %}
  <form class="contact-form" action="https://ssgform.com/s/h9Xtrgn8n5y9" method="POST">
    <label>
      <span>NAME お名前</span>
      <input type="text" name="name" autocomplete="name" required>
    </label>
    <label>
      <span>EMAIL メールアドレス</span>
      <input type="email" name="email" autocomplete="email" required>
    </label>
    <label>
      <span>MESSAGE お問い合わせ内容</span>
      <textarea name="message" rows="7" required></textarea>
    </label>
    <button type="submit">SEND</button>
  </form>
</article>
