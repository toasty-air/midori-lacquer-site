media:
  input: assets/works
  output: /assets/works

content:
  - name: about
    label: "概要（トップページ）"
    type: file
    path: index.md
    fields:
      - name: hero
        label: "トップの写真"
        type: image
        description: "トップページのいちばん上に大きく表示される写真です"
        options:
          extensions: [jpg, jpeg, png, webp]
          rename: safe
      - name: body
        label: "制作への想い"
        type: rich-text

  - name: works
    label: "作品"
    type: collection
    path: _works
    filename:
      template: "{year}{month}{day}-{hour}{minute}{second}.md"
      field: false
    view:
      fields: [title, year, order]
      primary: title
      sort: [order, year]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: "作品名"
        type: string
        required: true
      - name: title_en
        label: "作品名（英語）"
        type: string
        description: "空欄でも構いません"
      - name: image
        label: "写真"
        type: image
        required: true
        options:
          extensions: [jpg, jpeg, png, webp]
          rename: safe
      - name: technique
        label: "技法・素材"
        type: string
        description: "例：乾漆・朱漆"
      - name: dimension
        label: "サイズ"
        type: string
        description: "例：φ18×H9cm"
      - name: year
        label: "制作年"
        type: string
        description: "例：2025"
      - name: order
        label: "表示順"
        type: number
        description: "小さい数字ほど先に表示されます（10, 20, 30…と10刻みにしておくと、間に差し込みやすくなります）"

  - name: profile
    label: "プロフィール"
    type: file
    path: profile.md
    fields:
      - name: photo
        label: "プロフィール写真"
        type: image
        description: "空欄にすると写真なしのページになります"
        options:
          extensions: [jpg, jpeg, png, webp]
          rename: safe
      - name: body
        label: "プロフィール・経歴"
        type: rich-text

  - name: contact
    label: "お問い合わせ"
    type: file
    path: contact.md
    fields:
      - name: body
        label: "フォームの上に表示する文章"
        type: rich-text
